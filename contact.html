<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Little Touches. Find our postal address and ways to get in touch.">
    <title>Little Touches | Contact</title>
    <link rel="icon" type="image/x-icon" href="https://mokacoding.s3.amazonaws.com/little_touches-logo-square.jpeg">
    <style>
        body {
            margin: 0;
            font-family: 'Courier', monospace;
            background-color: #fff;
            color: #555;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem 6rem;
            box-sizing: border-box;
        }

        main {
            max-width: 520px;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: #444;
        }

        p {
            margin: 0.7rem 0;
            font-size: 1.05rem;
        }

        .address {
            margin-bottom: 1.4rem;
        }

        .address-divider {
            width: 64px;
            border: 0;
            border-top: 1px solid #ddd;
            margin: 0.6rem auto 1.5rem;
        }

        .actions a {
            display: block;
            margin: 1.15rem 0;
            text-decoration: none;
            color: #444;
            font-size: 1.05rem;
            transition: color 0.3s;
        }

        .actions a:hover {
            color: #000;
        }

        .action-divider {
            width: 48px;
            border: 0;
            border-top: 1px solid #e3e3e3;
            margin: 0.4rem auto;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f9f9f9;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>

<body>
    <main>
        <h1>Contact Little Touches</h1>

        <div class="address">
            <p>PO Box 217</p>
            <p>Mount Martha VIC 3934</p>
            <p>Australia</p>
        </div>
        <hr class="address-divider" />

        <div class="actions">
            <a href="mailto:hello@littletouches.com.au">hello@littletouches.com.au</a>
            <hr class="action-divider" />
            <a href="https://instagram.com/little.touches.co" target="_blank" rel="noopener noreferrer">@little.touches.co</a>
            <hr class="action-divider" />
            <a href="index.html">Back to Home</a>
        </div>
    </main>

    <footer>
        Made with ♥ in Mount Martha<br />
        © 2025
    </footer>
</body>

</html>
