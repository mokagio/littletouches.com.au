<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Little Touches - Artisanal greeting cards made with love in Mount Martha. Discover our unique handcrafted cards and connect with us.">
    <meta name="keywords" content="greeting cards, handcrafted, Mount Martha, Little Touches, handmade, artisan, cards">
    <meta name="author" content="Little Touches">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://littletouches.com.au/">
    <meta property="og:title" content="Little Touches">
    <meta property="og:description" content="Artisanal greeting cards made with love in Mount Martha">
    <meta property="og:image" content="https://mokacoding.s3.amazonaws.com/little_touches-logo-square.jpeg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://littletouches.com.au/">
    <meta property="twitter:title" content="Little Touches">
    <meta property="twitter:description" content="Artisanal greeting cards made with love in Mount Martha">
    <meta property="twitter:image" content="https://mokacoding.s3.amazonaws.com/little_touches-logo-square.jpeg">

    <title>Little Touches</title>
    <link rel="icon" type="image/x-icon" href="https://mokacoding.s3.amazonaws.com/little_touches-logo-square.jpeg">
    <style>
        body {
            margin: 0;
            font-family: 'Courier', monospace;
            background-color: #fff;
            color: #555;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .logo {
            max-width: 80vw;
            width: 200px;
            margin: 2rem 0;
        }

        .links a {
            display: block;
            margin: 1rem 0;
            text-decoration: none;
            color: #444;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #000;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f9f9f9;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>

<body>
    <img class="logo" src="https://mokacoding.s3.amazonaws.com/little_touches-logo-square.jpeg" alt="Little Touches logo" />

    <div class="links">
        <a href="https://shop.littletouches.com.au">Shop</a>
        <a href="https://instagram.com/little.touches.co" target="_blank">Instagram</a>
        <a href="mailto:hello@littletouches.com.au">Email Us</a>
    </div>

    <footer>
        Made with ♥ in Mount Martha<br />
        © 2025
    </footer>
</body>

</html>
